name: Deploy WE Manufacture Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare static preview
        shell: bash
        run: |
          rm -rf app/api
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            basePath: "/We-manufacture",
            assetPrefix: "/We-manufacture",
            trailingSlash: true,
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path("lib/site.ts"): [
                  ('const WE125 = "/media/we-125";', 'const WE125 = "/We-manufacture/media/we-125";'),
              ],
              Path("components/we-lockup.tsx"): [
                  ('src="/brand/we-icon.png"', 'src="/We-manufacture/brand/we-icon.png"'),
              ],
              Path("app/layout.tsx"): [
                  ('url: "/og.jpg"', 'url: "/We-manufacture/og.jpg"'),
                  ('icon: "/favicon.svg"', 'icon: "/We-manufacture/favicon.svg"'),
                  ('apple: "/brand/we-icon.png"', 'apple: "/We-manufacture/brand/we-icon.png"'),
              ],
          }
          for path, reps in replacements.items():
              s = path.read_text()
              for a, b in reps:
                  s = s.replace(a, b)
              path.write_text(s)
          PY

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
